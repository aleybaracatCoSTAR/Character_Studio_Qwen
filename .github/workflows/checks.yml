name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q studio scripts tests
      - run: node --check frontend/app.js && node --check frontend/recorder-worklet.js
      - run: bash -n scripts/setup.sh scripts/run.sh slurm/qwen-studio.sbatch
